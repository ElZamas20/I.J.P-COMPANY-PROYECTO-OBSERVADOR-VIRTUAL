<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observador Virtual - I.J.P. Company</title>
    <link rel="icon" type="image/png" href="logo circular IJP COMPANY-.png">
    <style>
        /* Redirige automáticamente al login después de 1 segundo */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            flex-direction: column;
            gap: 16px;
            color: #333;
        }
        .logo { font-size: 24px; font-weight: 900; letter-spacing: 1px; }
        .sub  { font-size: 14px; color: #777; }
        .bar  {
            width: 200px;
            height: 3px;
            background: #eee;
            border-radius: 2px;
            overflow: hidden;
        }
        .bar-inner {
            height: 100%;
            background: #2563eb;
            animation: load 1s linear forwards;
        }
        @keyframes load { from { width: 0; } to { width: 100%; } }
    </style>
</head>
<body>
    <div class="logo">I.J.P. Company</div>
    <div class="sub">Observador Virtual — cargando...</div>
    <div class="bar"><div class="bar-inner"></div></div>
    <script>
        setTimeout(function() {
            window.location.href = 'login.html';
        }, 1100);
    </script>
</body>
</html>
