<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Estudiantes - I.J.P. Company</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <span class="navbar-brand">I.J.P. Company</span>
    <div class="navbar-icons" style="margin-left:auto;">
        <button title="Perfil">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </button>
        <button title="Configuración">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
    </div>
</nav>

<!-- MAIN -->
<main>
    <div class="students-page">

        <!-- Filtros -->
        <div class="students-filters">
            <select id="filtro-grado">
                <option value="">grado</option>
                <option value="9">9</option>
                <option value="10">10</option>
                <option value="11">11</option>
            </select>
            <select id="filtro-curso">
                <option value="">curso</option>
                <option value="A">A</option>
                <option value="B">B</option>
            </select>
            <button class="btn-buscar" onclick="filtrarEstudiantes()">buscar estudiante</button>
        </div>

        <!-- Grid de estudiantes -->
        <div class="students-grid" id="students-grid">
            <!-- Los estudiantes se generan con JS -->
        </div>

    </div>
</main>

<!-- FOOTER -->
<footer>
    <span>&copy; 2025 Observador Virtual - Sistema de Seguimiento Escolar</span>
    <div class="footer-links">
        <a href="#">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        </a>
    </div>
</footer>

<script>
    // Datos de prueba de estudiantes
    var estudiantes = [
        { id: 1, codigo: '2023-00452', nombre: 'Carlos Martínez',    grado: '10', curso: 'B' },
        { id: 2, codigo: '2023-00453', nombre: 'Valentina García',   grado: '10', curso: 'B' },
        { id: 3, codigo: '2023-00454', nombre: 'Santiago Rodríguez', grado: '10', curso: 'A' },
        { id: 4, codigo: '2023-00455', nombre: 'Camila Hernández',   grado: '10', curso: 'A' },
        { id: 5, codigo: '2023-00456', nombre: 'Sebastián López',    grado: '11', curso: 'A' },
        { id: 6, codigo: '2023-00457', nombre: 'Isabella Gómez',     grado: '11', curso: 'B' },
        { id: 7, codigo: '2023-00458', nombre: 'Mateo Díaz',         grado: '10', curso: 'B' },
        { id: 8, codigo: '2023-00459', nombre: 'Sofía Vargas',       grado: '10', curso: 'B' },
        { id: 9, codigo: '2023-00460', nombre: 'Nicolás Suárez',     grado: '9',  curso: 'A' },
        { id:10, codigo: '2023-00461', nombre: 'Mariana Torres',     grado: '9',  curso: 'B' },
        { id:11, codigo: '2023-00462', nombre: 'Tomás Flores',       grado: '10', curso: 'B' },
        { id:12, codigo: '2023-00463', nombre: 'Lucía Reyes',        grado: '10', curso: 'A' },
        { id:13, codigo: '2023-00464', nombre: 'Emilio Ortiz',       grado: '11', curso: 'A' },
        { id:14, codigo: '2023-00465', nombre: 'Paula Ruiz',         grado: '11', curso: 'B' },
        { id:15, codigo: '2023-00466', nombre: 'Andrés Mora',        grado: '10', curso: 'B' },
        { id:16, codigo: '2023-00467', nombre: 'Daniela Pinto',      grado: '10', curso: 'B' }
    ];

    function renderEstudiantes(lista) {
        var grid = document.getElementById('students-grid');
        grid.innerHTML = '';
        lista.forEach(function(est) {
            var card = document.createElement('div');
            card.className = 'student-card';
            card.onclick = function() {
                window.location.href = 'observador-detalle.html?id=' + est.id + '&nombre=' + encodeURIComponent(est.nombre) + '&codigo=' + est.codigo + '&grado=' + est.grado + '-' + est.curso;
            };
            card.innerHTML =
                '<div class="student-photo">' +
                    '<span style="font-size:10px; text-align:center; color:#888; padding:6px;">"foto del<br>estudiante"</span>' +
                '</div>' +
                '<span class="student-name">"' + est.nombre + '"</span>';
            grid.appendChild(card);
        });
    }

    function filtrarEstudiantes() {
        var grado = document.getElementById('filtro-grado').value;
        var curso = document.getElementById('filtro-curso').value;
        var filtrados = estudiantes.filter(function(e) {
            return (!grado || e.grado === grado) && (!curso || e.curso === curso);
        });
        renderEstudiantes(filtrados);
    }

    // Renderiza todos al cargar
    renderEstudiantes(estudiantes);
</script>
</body>
</html>
