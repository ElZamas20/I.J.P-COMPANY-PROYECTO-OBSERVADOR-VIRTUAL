/* =========================================================
   MOSTRAR ESTUDIANTES
   ========================================================= */

function renderEstudiantes(lista) {

    var grid = document.getElementById('students-grid');

    grid.innerHTML = '';

    lista.forEach(function(est) {

        var card = document.createElement('div');

        card.className = 'student-card';


        /* Al hacer clic se abre el observador */

        card.onclick = function() {

            window.location.href =
                'observador-detalle.html' +
                '?id=' + est.id +
                '&nombre=' + encodeURIComponent(est.nombre) +
                '&codigo=' + est.codigo +
                '&grado=' + est.grado +
                '&jornada=' + encodeURIComponent(est.jornada);

        };


        /* Tarjeta del estudiante */

        card.innerHTML =

            '<div class="student-photo">' +

                '<span style="' +
                'font-size:10px;' +
                'text-align:center;' +
                'color:#888;' +
                'padding:6px;">' +

                    'foto del<br>estudiante' +

                '</span>' +

            '</div>' +

            '<span class="student-name">' +
                est.nombre +
            '</span>';

        
        grid.appendChild(card);

    });

}


/* =========================================================
   FILTRAR ESTUDIANTES
   ========================================================= */
function filtrarEstudiantes() {

    var grado = document.getElementById('filtro-grado').value;
    var jornada = document.getElementById('filtro-jornada').value;
    var grid = document.getElementById('students-grid');

    // =========================================
    // NO SELECCIONÓ NADA
    // =========================================

    if (!grado && !jornada) {

        grid.innerHTML = `
            <div class="mensaje-seleccion">
                <h2>Selecciona el grado o la jornada</h2>
                <p>
                    Selecciona un grado, una jornada o ambos
                    para ver los estudiantes.
                </p>
            </div>
        `;

        return;
    }


    // =========================================
    // SOLO SELECCIONÓ GRADO
    // =========================================

    if (grado && !jornada) {

        var manana = estudiantes.filter(function(e) {
            return e.grado === grado && e.jornada === 'mañana';
        });

        var tarde = estudiantes.filter(function(e) {
            return e.grado === grado && e.jornada === 'tarde';
        });

        grid.innerHTML = '';


        // JORNADA MAÑANA

        agregarTitulo(
            grid,
            'Jornada mañana',
            'Estudiantes del curso ' + grado + ' jornada mañana'
        );

        manana.forEach(function(est) {
            crearTarjetaEstudiante(est, grid);
        });


        // JORNADA TARDE

        agregarTitulo(
            grid,
            'Jornada tarde',
            'Estudiantes del curso ' + grado + ' jornada tarde'
        );

        tarde.forEach(function(est) {
            crearTarjetaEstudiante(est, grid);
        });

        return;
    }


    // =========================================
    // SOLO SELECCIONÓ JORNADA
    // =========================================

    if (!grado && jornada) {

        grid.innerHTML = '';

        // Mostrar primero grado 1, después grado 2,
        // después grado 3... hasta grado 11

        for (var numeroGrado = 1; numeroGrado <= 11; numeroGrado++) {

            var gradoActual = String(numeroGrado);

            var estudiantesGrado = estudiantes.filter(function(e) {
                return e.grado === gradoActual &&
                       e.jornada === jornada;
            });


            // Solo mostrar el grado si tiene estudiantes

            if (estudiantesGrado.length > 0) {

                agregarTitulo(
                    grid,
                    'Grado ' + gradoActual,
                    'Estudiantes del curso ' + gradoActual +
                    ' jornada ' + jornada
                );


                estudiantesGrado.forEach(function(est) {

                    crearTarjetaEstudiante(est, grid);

                });

            }
        }

        return;
    }


    // =========================================
    // SELECCIONÓ GRADO + JORNADA
    // =========================================

    if (grado && jornada) {

        var filtrados = estudiantes.filter(function(e) {
            return e.grado === grado &&
                   e.jornada === jornada;
        });

        grid.innerHTML = '';


        agregarTitulo(
            grid,
            'Jornada ' + jornada,
            'Estudiantes del curso ' + grado +
            ' jornada ' + jornada
        );


        filtrados.forEach(function(est) {

            crearTarjetaEstudiante(est, grid);

        });
    }
}
function agregarTitulo(grid, titulo, subtitulo) {

    var contenedor = document.createElement('div');

    contenedor.className = 'titulo-jornada';

    contenedor.innerHTML = `
        <h2>${titulo}</h2>
        <p>${subtitulo}</p>
    `;

    grid.appendChild(contenedor);
}
function crearTarjetaEstudiante(est, grid) {

    var card = document.createElement('div');

    card.className = 'student-card';

    card.onclick = function() {

        window.location.href =
            'observador-detalle.html' +
            '?id=' + est.id +
            '&nombre=' + encodeURIComponent(est.nombre) +
            '&codigo=' + est.codigo +
            '&grado=' + est.grado +
            '&jornada=' + encodeURIComponent(est.jornada);

    };


    card.innerHTML =
        '<div class="student-photo">' +
            '<span style="font-size:10px; text-align:center; color:#888; padding:6px;">' +
                '"foto del<br>estudiante"' +
            '</span>' +
        '</div>' +

        '<span class="student-name">' +
            '"' + est.nombre + '"' +
        '</span>';


    grid.appendChild(card);
}
