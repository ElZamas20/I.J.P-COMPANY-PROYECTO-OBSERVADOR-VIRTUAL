<!-- MAIN -->
<main>
    <div class="centered-page">
        <h2>Vamos a enviar un codigo de verificacion, por favor ingresa tu<br>correo de recuperacion:</h2>

        <form action="verificar-codigo.html" method="get" onsubmit="return enviarCodigo(event)">
            <div class="form-group">
                <label for="correo">Correo de recuperacion</label>
                <input type="email" id="correo" name="correo" required>
            </div>
            <button type="submit" class="btn-dark" style="width:100%;">Verificar</button>
        </form>
    </div>
</main>

<!-- FOOTER -->
<footer>

        <a href="#">Términos</a>
        <a href="#">Privacidad</a>
    </div>
</footer>

<script>
    function enviarCodigo(e) {
        e.preventDefault();
        var correo = document.getElementById('correo').value.trim();
        if (!correo) { alert('Por favor ingresa tu correo.'); return false; }
        // Simulación: redirige a la página de verificación de código
        window.location.href = 'verificar-codigo.html';
        return false;
    }
</script>
