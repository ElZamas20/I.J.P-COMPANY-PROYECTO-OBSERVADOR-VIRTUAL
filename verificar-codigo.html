<!-- MAIN -->
<main>
    <div class="centered-page">
        <h2>Por favor ingresa el codigo que hemos proporcionado a tu correo:</h2>

        <form action="nueva-contrasena.html" method="get" onsubmit="return verificarCodigo(event)">
            <div class="form-row">
                <label for="codigo">Codigo</label>
                <input type="text" id="codigo" name="codigo" maxlength="10" required>
            </div>
            <div style="margin-left:92px;">
                <button type="submit" class="btn-primary" style="width:160px;">Verificar</button>
            </div>
        </form>

<script>
    function verificarCodigo(e) {
        e.preventDefault();
        var codigo = document.getElementById('codigo').value.trim();
        if (!codigo) { alert('Por favor ingresa el código.'); return false; }
        window.location.href = 'nueva-contrasena.html';
        return false;
    }
</script>
