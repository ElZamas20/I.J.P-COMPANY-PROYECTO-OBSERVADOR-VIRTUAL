<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Información de Contacto - I.J.P. Company</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
    <span class="navbar-brand">I.J.P. Company</span>
    <div class="navbar-search">
        <input type="text" placeholder="search">
    </div>
    <div class="navbar-icons">
        <button title="Perfil">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </button>
        <button title="Configuración">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
    </div>
</nav>

<!-- MAIN -->
<main>
    <div class="docs-page">
        <p class="docs-subtitle">- - Información de contacto:</p>

        <!-- Cédula acudiente -->
        <div class="doc-item">
            <span class="doc-label">Cedula o documento de ciudadanía del acudiente:</span>
            <label for="cedula-acudiente" class="doc-upload">
                <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <p id="cedula-name">selecciona un archivo desde tu dispositivo</p>
                <input type="file" id="cedula-acudiente" accept=".pdf,.jpg,.jpeg,.png" onchange="mostrarNombre(this, 'cedula-name')">
            </label>
        </div>

        <!-- Actas de compromiso -->
        <div class="doc-item">
            <span class="doc-label">Actas de compromiso:</span>
            <label for="acta-compromiso" class="doc-upload">
                <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <p id="acta-name">selecciona un archivo desde tu dispositivo</p>
                <input type="file" id="acta-compromiso" accept=".pdf,.jpg,.jpeg,.png" onchange="mostrarNombre(this, 'acta-name')">
            </label>
        </div>

        <!-- Navegación -->
        <div style="display:flex; justify-content:flex-end; margin-top:28px; gap:10px;">
            <a href="datos-personales.html">
                <button class="btn-outline">Volver</button>
            </a>
            <a href="dashboard.html">
                <button class="btn-primary">Guardar y finalizar</button>
            </a>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer>
    <span>&copy; 2025-2026 I.J.P. Company. Todos los derechos reservados.</span>
    <div class="footer-links">
        <a href="#">Términos</a>
        <a href="#">Privacidad</a>
    </div>
</footer>

<!-- FAB -->
<button class="fab-help" title="Ayuda">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle></svg>
</button>

<script>
    function mostrarNombre(input, targetId) {
        var target = document.getElementById(targetId);
        if (input.files && input.files[0]) {
            target.textContent = input.files[0].name;
        }
    }
</script>
</body>
</html>
