<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observador Académico - I.J.P. Company</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- NAVBAR ESPECIAL (observador académico) -->
<nav class="obs-navbar">
    <div class="obs-navbar-left">
        <!-- Logo colegio placeholder -->
        <div class="obs-navbar-logo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#aaa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="3" y1="9" x2="21" y2="9"></line>
                <line x1="9" y1="21" x2="9" y2="9"></line>
            </svg>
        </div>
        <div class="obs-navbar-logo-text">
            (logo del colegio)
        </div>
        <!-- Título editable -->
        <div class="obs-navbar-title">Observador Academico:</div>
    </div>

    <div class="obs-navbar-center">
        <button class="obs-navbar-info-btn">Informacion del estudiante</button>
    </div>

    <div class="obs-navbar-right">
        <!-- Avatar estudiante -->
        <div style="display:flex; flex-direction:column; align-items:center; gap:2px;">
            <div style="width:36px; height:36px; border-radius:50%; border:1.5px solid #ccc; display:flex; align-items:center; justify-content:center; background:#f5f5f5;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
            <span class="obs-navbar-student-name" id="nav-nombre">nombre del estudiante</span>
        </div>

        <button title="Configuración" style="background:none;border:none;cursor:pointer;color:#444;display:flex;align-items:center;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
    </div>
</nav>

<!-- MAIN -->
<main>
    <div style="padding: 20px 24px;">

        <!-- Tabla académica -->
        <table class="obs-table academic-table">
            <thead>
                <tr>
                    <th>PERIODO</th>
                    <th>ASPECTO ACADEMICO</th>
                    <th>ASPECTO CONVIVENCIAL</th>
                    <th>COMPROMISO</th>
                </tr>
            </thead>
            <tbody id="academic-tbody">
                <!-- Filas generadas por JS -->
            </tbody>
        </table>

        <div style="margin-top:16px;">
            <a href="observador-detalle.html">
                <button class="btn-outline">Volver</button>
            </a>
        </div>
    </div>
</main>

<!-- FOOTER (sin texto visible en la imagen, pero con separador) -->
<footer>
    <span></span>
</footer>

<!-- FAB -->
<button class="fab-help" title="Ayuda">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle></svg>
</button>

<script>
    // Leer parámetros de URL
    var params = new URLSearchParams(window.location.search);
    var nombre = params.get('nombre') || 'nombre del estudiante';
    document.getElementById('nav-nombre').textContent = nombre;

    // Datos de prueba académicos
    var datosAcademicos = [
        { periodo: '2023-2', academico: 'Participación activa en matemáticas y ciencias.', convivencial: 'Comportamiento ejemplar, actitud positiva.', compromiso: 'Mantener el ritmo académico' },
        { periodo: '2023-1', academico: 'Dificultad en resolución de problemas algebraicos.', convivencial: 'Puntualidad mejorada en el período.', compromiso: 'Asistir a clases de refuerzo' },
        { periodo: '2022-2', academico: 'Excelente desempeño en el proyecto de ciencias.', convivencial: 'Integración y liderazgo con el grupo.', compromiso: 'Liderar grupo de estudio' }
    ];

    function renderAcademico() {
        var tbody = document.getElementById('academic-tbody');
        tbody.innerHTML = '';
        var total = Math.max(datosAcademicos.length, 5);
        for (var i = 0; i < total; i++) {
            var tr = document.createElement('tr');
            if (datosAcademicos[i]) {
                var d = datosAcademicos[i];
                tr.innerHTML =
                    '<td>' + d.periodo + '</td>' +
                    '<td>' + d.academico + '</td>' +
                    '<td>' + d.convivencial + '</td>' +
                    '<td>' + d.compromiso + '</td>';
            } else {
                tr.innerHTML = '<td style="color:#ccc;">...</td><td style="color:#ccc;">...</td><td style="color:#ccc;">...</td><td style="color:#ccc;">...</td>';
            }
            tbody.appendChild(tr);
        }
    }

    renderAcademico();
</script>
</body>
</html>
