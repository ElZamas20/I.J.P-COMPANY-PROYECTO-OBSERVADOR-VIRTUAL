<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar - I.J.P. Company</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .register-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 36px;
        }
        .register-box {
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 28px 36px;
            width: 400px;
            margin-bottom: 20px;
        }
        .register-box h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            color: #111;
        }
        .register-box label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #333;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .register-box input, .register-box select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 14px;
            outline: none;
            color: #333;
        }
        .register-box input:focus, .register-box select:focus { border-color: #2563eb; }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-minimal">
    <span class="navbar-brand">I.J.P. Company</span>
    <div class="navbar-icons">
        <a href="login.html" title="Inicio">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        </a>
        <a href="#" title="Configuración">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </a>
    </div>
</nav>

<!-- MAIN -->
<main>
    <div class="register-page">
        <div class="register-box">
            <h2>CREAR CUENTA</h2>
            <form onsubmit="return registrar(event)">
                <label for="r-nombre">NOMBRE COMPLETO:</label>
                <input type="text" id="r-nombre" placeholder="Ingrese su nombre" required>

                <label for="r-email">CORREO ELECTRÓNICO:</label>
                <input type="email" id="r-email" placeholder="ejemplo@correo.com" required>

                <label for="r-usuario">USUARIO:</label>
                <input type="text" id="r-usuario" placeholder="Nombre de usuario" required>

                <label for="r-rol">ROL:</label>
                <select id="r-rol">
                    <option value="acudiente">Acudiente</option>
                    <option value="docente">Docente</option>
                    <option value="admin">Administrador</option>
                </select>

                <label for="r-pass">CONTRASEÑA:</label>
                <input type="password" id="r-pass" placeholder="••••••••" required>

                <label for="r-pass2">CONFIRMAR CONTRASEÑA:</label>
                <input type="password" id="r-pass2" placeholder="••••••••" required>

                <button type="submit" class="btn-login">Registrar</button>
            </form>
            <div style="text-align:center; margin-top:12px; font-size:13px;">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
            </div>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer>
    <span>&copy; 2025-2026 Observador Virtual - Sistema de Seguimiento Escolar</span>
    <div class="footer-links">
    <a href="#">Términos</a>
        <a href="#">Privacidad</a>
        </div>
</footer>

<script>
    function registrar(e) {
        e.preventDefault();
        var pass  = document.getElementById('r-pass').value;
        var pass2 = document.getElementById('r-pass2').value;
        if (pass !== pass2) {
            alert('Las contraseñas no coinciden.');
            return false;
        }
        if (pass.length < 6) {
            alert('La contraseña debe tener al menos 6 caracteres.');
            return false;
        }
        alert('Registro exitoso. Por favor inicia sesión.');
        window.location.href = 'login.html';
        return false;
    }
</script>
</body>
</html>
