<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observador Virtual - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-minimal">
    <span class="navbar-brand">I.J.P. Company</span>
    <div class="navbar-icons">
        <!-- Inicio -->
        <a href="login.html" title="Inicio">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </a>
        <!-- Configuración -->
        <a href="#" title="Configuración">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </a>
    </div>
</nav>

<!-- MAIN -->
<main>
    <div class="login-page">
        <h1 class="login-title">OBSERVADOR VIRTUAL</h1>

        <!-- Logo placeholder -->
        <img src="logo IJP COMPANY.png" width="100" height="100"></img>

        <!-- Formulario de login -->
        <div class="login-box">
            <form action="dashboard.html" method="get" onsubmit="return validarLogin(event)">
                <label for="usuario">USUARIO:</label>
                <input type="text" id="usuario" name="usuario" placeholder="ingrese su usuario" required>

                <label for="contrasena">CONTRASEÑA:</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="••••••••••" required>

                <button type="submit" class="btn-login">iniciar sesión</button>
            </form>

            <a href="recuperar-contrasena.html" class="login-forgot">¿olvidaste tu contraseña?</a>
        </div>

        <!-- Botones inferiores -->
        <div class="login-actions">
            <a href="registro.html">
                <button class="btn-solid">registrar</button>
            </a>
            <button class="btn-solid" onclick="window.location.href='dashboard.html'">iniciar sesion</button>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer>
    <span>&copy; 2025-2026 Observador Virtual - Sistema de Seguimiento Escolar</span>
    <div class="footer-links">
        <a href="#">Términos</a>
        <a href="#">Privacidad</a>
    </div>
</footer>

<script>
    function validarLogin(e) {
        e.preventDefault();
        var usuario = document.getElementById('usuario').value.trim();
        var contrasena = document.getElementById('contrasena').value.trim();
        if (!usuario || !contrasena) {
            alert('Por favor ingresa usuario y contraseña.');
            return false;
        }
        // Simulación: en producción se haría una petición al servidor
        window.location.href = 'dashboard.html';
        return false;
    }
</script>
</body>
</html>
